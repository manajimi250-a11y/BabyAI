name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-build-cache

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: baby-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

      - name: Decode release keystore
        if: ${{ secrets.BABYAI_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.BABYAI_KEYSTORE_BASE64 }}" | base64 -d > app/babyai-release.jks

      - name: Build signed release APK
        if: ${{ secrets.BABYAI_KEYSTORE_BASE64 != '' }}
        run: |
          gradle assembleRelease --stacktrace --no-build-cache \
            -PBABYAI_STORE_PASSWORD=${{ secrets.BABYAI_STORE_PASSWORD }} \
            -PBABYAI_KEY_ALIAS=${{ secrets.BABYAI_KEY_ALIAS }} \
            -PBABYAI_KEY_PASSWORD=${{ secrets.BABYAI_KEY_PASSWORD }}

      - name: Upload release APK artifact
        if: ${{ secrets.BABYAI_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: baby-ai-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
