name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-build-cache

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: baby-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

      - name: Check if release secrets exist
        env:
          KEYSTORE_B64: ${{ secrets.BABYAI_KEYSTORE_BASE64 }}
        run: echo "has_keystore=${{ env.KEYSTORE_B64 != '' }}" >> "$GITHUB_ENV"

      - name: Decode release keystore
        if: env.has_keystore == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.BABYAI_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > app/babyai-release.jks

      - name: Build signed release APK
        if: env.has_keystore == 'true'
        env:
          BABYAI_STORE_PASSWORD: ${{ secrets.BABYAI_STORE_PASSWORD }}
          BABYAI_KEY_ALIAS: ${{ secrets.BABYAI_KEY_ALIAS }}
          BABYAI_KEY_PASSWORD: ${{ secrets.BABYAI_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace --no-build-cache \
            -PBABYAI_STORE_PASSWORD="$BABYAI_STORE_PASSWORD" \
            -PBABYAI_KEY_ALIAS="$BABYAI_KEY_ALIAS" \
            -PBABYAI_KEY_PASSWORD="$BABYAI_KEY_PASSWORD"

      - name: Upload release APK artifact
        if: env.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: baby-ai-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
